name: PixelPets
options:
  bundleIdPrefix: com.colindelacroix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PixelPets:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pixel Pets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colindelacroix.pixelpets
    dependencies:
      - target: PixelPetsWidget
    scheme: {}
  PixelPetsWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Pixel Pets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - ParadeLeft0.ttf
          - ParadeLeft1.ttf
          - ParadeLeft2.ttf
          - ParadeLeft3.ttf
          - ParadeLeft4.ttf
          - ParadeLeft5.ttf
          - ParadeLeft6.ttf
          - ParadeLeft7.ttf
          - ParadeLeft8.ttf
          - ParadeLeft9.ttf
          - ParadeRight0.ttf
          - ParadeRight1.ttf
          - ParadeRight2.ttf
          - ParadeRight3.ttf
          - ParadeRight4.ttf
          - ParadeRight5.ttf
          - ParadeRight6.ttf
          - ParadeRight7.ttf
          - ParadeRight8.ttf
          - ParadeRight9.ttf
          - ParadeWide0.ttf
          - ParadeWide1.ttf
          - ParadeWide2.ttf
          - ParadeWide3.ttf
          - ParadeWide4.ttf
          - ParadeWide5.ttf
          - ParadeWide6.ttf
          - ParadeWide7.ttf
          - ParadeWide8.ttf
          - ParadeWide9.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colindelacroix.pixelpets.widget
